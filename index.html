<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Summer Vibes: Raffle</title>
  <link rel="icon" type="image/png" href="ssite.png">
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Luckiest+Guy&family=Montserrat:wght@700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --ocean-blue: #0077be;
      --sky-blue: #87ceeb;
      --sand-yellow: #f6d7b0;
      --coral: #ff7f50;
      --glass-bg: rgba(255, 255, 255, 0.25);
    }

    * {
      box-sizing: border-box;
    }

    body,
    html {
      margin: 0;
      padding: 0;
      height: 100%;
      width: 100%;
      font-family: 'Montserrat', sans-serif;
      overflow: hidden;
      background: linear-gradient(180deg, var(--sky-blue) 0%, #e0f7fa 100%);
    }

    /* Animated Sun */
    .sun {
      position: absolute;
      top: 40px;
      right: 40px;
      width: 100px;
      height: 100px;
      background: #ffce54;
      border-radius: 50%;
      box-shadow: 0 0 40px #ffce54, 0 0 100px #f6d7b0;
      animation: pulse 4s ease-in-out infinite;
      z-index: 0;
    }

    @keyframes pulse {
      0%, 100% { transform: scale(1); opacity: 0.9; }
      50% { transform: scale(1.1); opacity: 1; }
    }

    /* Background Logo Styling */
    .logo-background {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 95vw;
      max-width: 1600px;
      opacity: 0.75;
      z-index: 1;
      pointer-events: none;
    }

    .container {
      position: relative;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      height: 100vh;
      z-index: 10;
    }

    h1 {
      font-family: 'Luckiest Guy', cursive;
      font-size: 5em;
      margin-bottom: 20px;
      margin-top: 0;
      color: #fff;
      text-shadow: 4px 4px 0px var(--ocean-blue), 8px 8px 20px rgba(0,0,0,0.1);
      letter-spacing: 2px;
    }

    /* Glassmorphism Display */
    #nameDisplay {
      font-size: 5em;
      font-weight: 700;
      color: #fff;
      padding: 40px 80px;
      border-radius: 30px;
      background: var(--glass-bg);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.3);
      box-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.15);
      text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.2);
      display: inline-block;
      min-width: 450px;
      transition: all 0.3s ease;
    }

    #winnerText {
      font-family: 'Luckiest Guy', cursive;
      font-size: 3.5em;
      margin-top: 25px;
      color: var(--coral);
      text-shadow: 2px 2px 0px #fff, 4px 4px 15px rgba(255, 127, 80, 0.4);
      display: none;
      animation: bounce 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    @keyframes bounce {
      0% { transform: scale(0.5); }
      100% { transform: scale(1); }
    }

    button {
      margin-top: 50px;
      font-family: 'Luckiest Guy', cursive;
      font-size: 2em;
      padding: 20px 60px;
      border: none;
      border-radius: 50px;
      cursor: pointer;
      background: var(--coral);
      color: #fff;
      box-shadow: 0 8px 0px #d45d31;
      transition: all 0.1s;
      letter-spacing: 1px;
    }

    button:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 0px #d45d31;
      filter: brightness(1.1);
    }

    button:active {
      transform: translateY(6px);
      box-shadow: 0 2px 0px #d45d31;
    }

    /* Wave Animation */
    .waves {
      position: absolute;
      bottom: 0;
      width: 100%;
      height: 15vh;
      min-height: 100px;
      max-height: 150px;
      z-index: 5;
    }

    .parallax > use {
      animation: move-forever 25s cubic-bezier(.55,.5,.45,.5) infinite;
    }
    .parallax > use:nth-child(1) { animation-delay: -2s; animation-duration: 7s; }
    .parallax > use:nth-child(2) { animation-delay: -3s; animation-duration: 10s; }
    .parallax > use:nth-child(3) { animation-delay: -4s; animation-duration: 13s; }
    .parallax > use:nth-child(4) { animation-delay: -5s; animation-duration: 20s; }

    @keyframes move-forever {
      0% { transform: translate3d(-90px,0,0); }
      100% { transform: translate3d(85px,0,0); }
    }

    @media (max-width: 768px) {
      h1 { font-size: 3em; }
      #nameDisplay { font-size: 3em; padding: 20px 40px; min-width: 300px; }
      .waves { height: 40px; min-height: 40px; }
    }
  </style>
</head>

      <defs>
        <path id="gentle-wave" d="M-160 44c30 0 58-18 88-18s 58 18 88 18 58-18 88-18 58 18 88 18 v44h-352z" />
      </defs>
      <g class="parallax">
        <use xlink:href="#gentle-wave" x="48" y="0" fill="rgba(255,255,255,0.7" />
        <use xlink:href="#gentle-wave" x="48" y="3" fill="rgba(255,255,255,0.5)" />
        <use xlink:href="#gentle-wave" x="48" y="5" fill="rgba(255,255,255,0.3)" />
        <use xlink:href="#gentle-wave" x="48" y="7" fill="#fff" />

    function startRaffle() {
      clearInterval(interval);
      const winnerText = document.getElementById("winnerText");
      winnerText.style.display = "none";
      const display = document.getElementById("nameDisplay");

      const shuffleSound = document.getElementById("shuffleSound");
      const winSound = document.getElementById("winSound");
      shuffleSound.currentTime = 0;
      shuffleSound.loop = true;
      shuffleSound.play();

      const duration = 6000; // Reduced to 6s for better UX

          winnerText.style.display = "block";
